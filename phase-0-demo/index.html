<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kuyash — Phase 0 Demo</title>
  <!--
    Kuyash Phase 0 — static clickable dashboard demo (visual redesign).
    Zero external requests: fonts are self-hosted under assets/fonts/ (OFL),
    no CDN, no libraries. Works offline via file://. Classic scripts only
    (no ES modules — Chrome blocks them under file://).
    All mock data lives in data/mock-data.js; all UI strings in i18n/.
  -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%232DD4BF'/%3E%3Cpath d='M8 6h6.5a3.5 3.5 0 010 7H11v5H8V6z' fill='%2304211D'/%3E%3C/svg%3E">
  <!-- no font preload: <link rel=preload as=font> forces a CORS fetch, which
       file:// (origin null) rejects. @font-face below loads the same local
       files without CORS. Fonts are ~540KB local — no flash risk. -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/motion.css">
  <link rel="stylesheet" href="css/skins.css">
  <link rel="stylesheet" href="css/screens.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"><!-- built by app.js --></aside>
    <header class="topbar" id="topbar"><!-- built by app.js --></header>
    <main class="main" id="screen-root"><!-- active screen renders here --></main>
  </div>

  <div class="scrim"></div>
  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>

  <!-- order matters: i18n dictionaries → i18n helper → data → state → motion → live
       → components → drawers/palette → screens → app -->
  <script src="i18n/en.js"></script>
  <script src="i18n/tr.js"></script>
  <script src="js/i18n.js"></script>
  <script src="data/mock-data.js"></script>
  <script src="js/state.js"></script>
  <script src="js/motion.js"></script>
  <script src="js/live.js"></script>
  <script src="js/components.js"></script>
  <script src="js/drawers.js"></script>
  <script src="js/palette.js"></script>
  <script src="js/screens/dashboard.js"></script>
  <script src="js/screens/trends.js"></script>
  <script src="js/screens/studio.js"></script>
  <script src="js/screens/library.js"></script>
  <script src="js/screens/workflow.js"></script>
  <script src="js/screens/queue.js"></script>
  <script src="js/screens/accounts.js"></script>
  <script src="js/screens/preview.js"></script>
  <script src="js/screens/logs.js"></script>
  <script src="js/screens/analytics.js"></script>
  <script src="js/screens/usage.js"></script>
  <script src="js/screens/settings.js"></script>
  <script src="js/screens/onboarding.js"></script>
  <script src="js/screens/create.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
